<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | ULTRAKILL</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        #mini-console-toggle {
            position: fixed;
            bottom: 10px;
            right: 10px;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.75);
            color: #0f0;
            border: 1px solid #0f0;
            padding: 6px 10px;
            font-family: monospace;
            font-size: 12px;
            cursor: pointer;
            border-radius: 4px;
        }

        #mini-console {
            display: none;
            position: fixed;
            bottom: 45px;
            right: 10px;
            width: 420px;
            max-width: 90vw;
            height: 220px;
            background: rgba(15, 15, 15, 0.92);
            color: #eee;
            border: 1px solid #444;
            font-family: monospace;
            font-size: 12px;
            overflow-y: auto;
            padding: 8px;
            text-align: left;
            z-index: 9999;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .log-err { color: #ff5555; }
        .log-warn { color: #ffaa00; }
        .log-info { color: #55ff55; }
    </style>
</head>

<body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <button id="mini-console-toggle" onclick="toggleConsole()">Console (0)</button>
    <div id="mini-console"></div>

    <script>
        (function () {
            const box = document.getElementById('mini-console');
            const btn = document.getElementById('mini-console-toggle');
            let count = 0;

            window.toggleConsole = function () {
                box.style.display = box.style.display === 'block' ? 'none' : 'block';
            };

            function addLog(type, args) {
                count++;
                btn.textContent = 'Console (' + count + ')';
                if (type === 'err') btn.style.borderColor = '#ff5555';

                const line = document.createElement('div');
                line.className = 'log-' + type;
                line.style.marginBottom = '4px';
                line.style.wordBreak = 'break-word';
                line.textContent = '[' + type.toUpperCase() + '] ' + Array.from(args).map(a => {
                    if (a instanceof Error) return a.message + '\n' + a.stack;
                    if (typeof a === 'object') {
                        try { return JSON.stringify(a); } catch (e) { return String(a); }
                    }
                    return String(a);
                }).join(' ');
                box.appendChild(line);
                box.scrollTop = box.scrollHeight;
            }

            const origLog = console.log;
            const origWarn = console.warn;
            const origErr = console.error;

            console.log = function () { addLog('info', arguments); origLog.apply(console, arguments); };
            console.warn = function () { addLog('warn', arguments); origWarn.apply(console, arguments); };
            console.error = function () { addLog('err', arguments); origErr.apply(console, arguments); };

            window.addEventListener('error', function (e) {
                addLog('err', ['Uncaught Error: ' + e.message + ' (' + e.filename + ':' + e.lineno + ')']);
            });

            window.addEventListener('unhandledrejection', function (e) {
                addLog('err', ['Promise Rejected: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)]);
            });
        })();
    </script>

    <div id='loading-text' style="color: black; font-family: cursive; font-size: 48px; text-align: center; margin-top: 20px;">LOADING...</div>
    <canvas id="unity-canvas" tabindex="-1" hidden></canvas>
    <script src="Build/9853637125e801e9aae48e78dbbdcfca.loader.js"></script>
    <script>
        var canvas = document.querySelector("#unity-canvas");
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            canvas.style.width = "100%";
            canvas.style.height = "100%";
            canvas.style.position = "fixed";
            document.body.style.textAlign = "left";
        } else {
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                canvas.style.width = window.innerWidth + "px";
                canvas.style.height = window.innerHeight + "px";
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let buffers = [];

                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        console.log("All data parts merged successfully.");
                        let mergedBlob = new Blob(buffers);
                        let mergedFileUrl = URL.createObjectURL(mergedBlob);
                        resolve(mergedFileUrl);
                        return;
                    }
                    console.log("Fetching " + fileParts[index] + "...");
                    fetch(fileParts[index]).then((response) => {
                        if (!response.ok) throw new Error("HTTP " + response.status + " on " + fileParts[index]);
                        return response.arrayBuffer();
                    }).then((data) => {
                        buffers.push(data);
                        fetchPart(index + 1);
                    }).catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }

        Promise.all([
            mergeFiles(getParts("Build/2facc552a7176a3c4f6184e293ead869.data.unityweb", 1, 3))
        ]).then(([dataUrl]) => {
            console.log("Starting Unity instance...");
            document.querySelector("#unity-canvas").hidden = false;
            createUnityInstance(document.querySelector("#unity-canvas"), {
                dataUrl: dataUrl,
                frameworkUrl: "Build/372c51523da4553ad9ad6740d46ef615.framework.js.unityweb",
                codeUrl: "Build/4316a55f7504875581587d5c75896d34.wasm.unityweb",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Hakita",
                productName: "ULTRAKILL",
                productVersion: "1.0",
            }).then((e) => {
                console.log("ULTRAKILL loaded!");
                document.querySelector("#loading-text").remove();
            }).catch((err) => {
                console.error("Unity failed to start:", err);
            });
        }).catch((err) => {
            console.error("Failed to load game files:", err);
        });
    </script>
</body>

</html>
